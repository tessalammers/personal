<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recept Omzetter 👨‍🍳</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 10px;
            color: #333;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 5px;
            font-weight: 700;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .content {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        /* Input Section */
        .input-section {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-weight: 600;
            font-size: 15px;
            color: #333;
        }

        input[type="text"],
        input[type="number"],
        textarea {
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            font-family: inherit;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus,
        input[type="number"]:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 10px;
        }

        button {
            padding: 14px 20px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        button:active {
            transform: scale(0.98);
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            box-shadow: 0 8px 16px rgba(102, 126, 234, 0.3);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 14px;
            width: auto;
        }

        .btn-danger {
            background: #ff6b6b;
            color: white;
        }

        /* Tabs */
        .tabs {
            display: none;
            gap: 0;
            border-bottom: 2px solid #e0e0e0;
            margin-bottom: 20px;
        }

        .tabs.active {
            display: flex;
        }

        .tab {
            flex: 1;
            padding: 14px;
            background: none;
            border: none;
            border-bottom: 3px solid transparent;
            cursor: pointer;
            font-weight: 600;
            color: #999;
            transition: all 0.2s;
        }

        .tab:hover {
            color: #667eea;
        }

        .tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        /* Tab Content */
        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* History & Favorites */
        .history-item,
        .favorite-item {
            padding: 14px;
            background: #f9f9f9;
            border-radius: 10px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .history-item a,
        .favorite-item a {
            color: #667eea;
            text-decoration: none;
            flex: 1;
            cursor: pointer;
            font-weight: 500;
        }

        .history-item a:hover,
        .favorite-item a:hover {
            text-decoration: underline;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #bbb;
        }

        /* Recipe View */
        .recipe-view {
            display: none;
        }

        .recipe-view.active {
            display: block;
        }

        .recipe-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 3px solid #e0e0e0;
            gap: 15px;
        }

        .recipe-title h1 {
            font-size: 28px;
            color: #333;
            line-height: 1.3;
        }

        .favorite-btn {
            font-size: 40px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            transition: transform 0.2s;
        }

        .favorite-btn:hover {
            transform: scale(1.1);
        }

        .recipe-section {
            margin-bottom: 30px;
        }

        .recipe-section h2 {
            font-size: 20px;
            color: #333;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
            padding-left: 15px;
            font-weight: 700;
        }

        .servings-control {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
            font-size: 16px;
            background: #f9f9f9;
            padding: 12px 15px;
            border-radius: 10px;
            width: fit-content;
        }

        .servings-control button {
            width: 40px;
            height: 40px;
            padding: 0;
            border-radius: 50%;
            background: white;
            color: #667eea;
            font-weight: bold;
            font-size: 18px;
            border: 2px solid #667eea;
        }

        .servings-value {
            min-width: 100px;
            text-align: center;
            font-weight: 600;
            color: #667eea;
        }

        .time-badge {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 14px;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .ingredients-list {
            list-style: none;
        }

        .ingredients-list li {
            padding: 12px;
            background: #f9f9f9;
            border-radius: 8px;
            margin-bottom: 8px;
            border-left: 4px solid #667eea;
            font-size: 15px;
            line-height: 1.5;
        }

        .step {
            padding: 15px;
            background: #f9f9f9;
            border-radius: 8px;
            margin-bottom: 12px;
            line-height: 1.7;
            font-size: 15px;
        }

        .step strong {
            color: #667eea;
            font-weight: 700;
        }

        .back-btn {
            width: 100%;
            margin-top: 30px;
        }

        @media (max-width: 600px) {
            .container {
                border-radius: 0;
                min-height: 100vh;
            }

            .header {
                padding: 20px 15px;
            }

            .header h1 {
                font-size: 24px;
            }

            .recipe-title h1 {
                font-size: 24px;
            }

            .button-group {
                grid-template-columns: 1fr;
            }

            .recipe-header {
                flex-direction: column;
            }

            .favorite-btn {
                font-size: 32px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>👨‍🍳 Recept Omzetter</h1>
            <p>Recepten op een duidelijke manier</p>
        </div>

        <!-- Main Content -->
        <div class="content">

            <!-- Input Section -->
            <div class="input-section" id="inputSection">
                <div class="input-group">
                    <label for="recipeName">📝 Naam van het recept</label>
                    <input
                        type="text"
                        id="recipeName"
                        placeholder="bijv. Spaghetti Carbonara"
                    >
                </div>

                <div class="input-group">
                    <label for="recipeServings">👥 Aantal personen</label>
                    <input
                        type="number"
                        id="recipeServings"
                        value="4"
                        min="1"
                    >
                </div>

                <div class="input-group">
                    <label for="recipeTime">⏱️ Bereidingstijd (minuten)</label>
                    <input
                        type="number"
                        id="recipeTime"
                        value="30"
                        min="1"
                    >
                </div>

                <div class="input-group">
                    <label for="recipeIngredients">🥘 Ingrediënten (één per regel)</label>
                    <textarea
                        id="recipeIngredients"
                        placeholder="bijv: 400g pasta&#10;2 eieren&#10;100g pancetta"
                    ></textarea>
                </div>

                <div class="input-group">
                    <label for="recipePrep">🔪 Voorbereiding (Mise en place)</label>
                    <textarea
                        id="recipePrep"
                        placeholder="Beschrijf de voorbereiding stap voor stap..."
                    ></textarea>
                </div>

                <div class="input-group">
                    <label for="recipeCooking">👨‍🍳 Bereiding</label>
                    <textarea
                        id="recipeCooking"
                        placeholder="Beschrijf de bereiding stap voor stap..."
                    ></textarea>
                </div>

                <div class="button-group">
                    <button class="btn-primary" onclick="convertRecipe()">Begin met koken 👨‍🍳</button>
                    <button class="btn-secondary" onclick="loadDemo()">Demo zien</button>
                </div>
            </div>

            <!-- Tabs -->
            <div class="tabs" id="tabsSection">
                <button class="tab active" onclick="switchTab(0)">Recept</button>
                <button class="tab" onclick="switchTab(1)">Geschiedenis</button>
                <button class="tab" onclick="switchTab(2)">Favorieten</button>
            </div>

            <!-- Recipe View -->
            <div class="recipe-view" id="recipeView"></div>

            <!-- History Tab -->
            <div class="tab-content active" id="historyTab">
                <div id="historyList"></div>
                <div class="empty-state" id="historyEmpty" style="display:none;">
                    <p>📚 Nog geen recepten bekeken</p>
                </div>
            </div>

            <!-- Favorites Tab -->
            <div class="tab-content" id="favoritesTab">
                <div id="favoritesList"></div>
                <div class="empty-state" id="favoritesEmpty" style="display:none;">
                    <p>❤️ Nog geen favorieten</p>
                </div>
            </div>

        </div>
    </div>

    <script>
        // State
        let currentRecipe = null;
        let currentServings = 4;

        // Storage
        function getHistory() {
            return JSON.parse(localStorage.getItem('recipeHistory') || '[]');
        }

        function getFavorites() {
            return JSON.parse(localStorage.getItem('recipeFavorites') || '[]');
        }

        function saveHistory(data) {
            localStorage.setItem('recipeHistory', JSON.stringify(data));
        }

        function saveFavorites(data) {
            localStorage.setItem('recipeFavorites', JSON.stringify(data));
        }

        // Convert recipe
        function convertRecipe() {
            const name = document.getElementById('recipeName').value.trim();
            if (!name) {
                alert('Voer een receptnaam in');
                return;
            }

            const recipe = {
                name: name,
                servings: parseInt(document.getElementById('recipeServings').value) || 4,
                time: parseInt(document.getElementById('recipeTime').value) || 30,
                ingredients: document.getElementById('recipeIngredients').value
                    .split('\n')
                    .map(i => i.trim())
                    .filter(i => i),
                prep: document.getElementById('recipePrep').value.trim(),
                cooking: document.getElementById('recipeCooking').value.trim(),
                isFavorite: false
            };

            if (!recipe.ingredients.length || !recipe.prep || !recipe.cooking) {
                alert('Vul alle velden in');
                return;
            }

            displayRecipe(recipe);
        }

        // Display recipe
        function displayRecipe(recipe) {
            currentRecipe = recipe;
            currentServings = recipe.servings;

            // Add to history
            const history = getHistory();
            history.unshift({
                name: recipe.name,
                recipe: recipe,
                timestamp: new Date().toISOString()
            });
            saveHistory(history.slice(0, 20));

            // Check if favorite
            const favorites = getFavorites();
            recipe.isFavorite = favorites.some(f => f.name === recipe.name);

            // Show recipe view
            document.getElementById('inputSection').style.display = 'none';
            document.getElementById('tabsSection').classList.add('active');

            renderRecipe();
            switchTab(0);
        }

        // Render recipe
        function renderRecipe() {
            if (!currentRecipe) return;

            const recipe = currentRecipe;
            const scale = currentServings / recipe.servings;

            let html = `
                <div class="recipe-header">
                    <div class="recipe-title">
                        <h1>${escapeHtml(recipe.name)}</h1>
                    </div>
                    <button class="favorite-btn" onclick="toggleFavorite()" title="Favoriet">
                        ${recipe.isFavorite ? '❤️' : '🤍'}
                    </button>
                </div>

                <div class="recipe-section">
                    <h2>Ingrediënten</h2>
                    <div class="servings-control">
                        <button onclick="changeServings(-1)">−</button>
                        <span class="servings-value">${currentServings} personen</span>
                        <button onclick="changeServings(+1)">+</button>
                    </div>
                    <div class="time-badge">⏱️ ${recipe.time} minuten</div>
                    <ul class="ingredients-list">
            `;

            recipe.ingredients.forEach(ingredient => {
                const scaled = scaleIngredient(ingredient, scale);
                html += `<li>${escapeHtml(scaled)}</li>`;
            });

            html += `
                    </ul>
                </div>

                <div class="recipe-section">
                    <h2>Voorbereiding</h2>
            `;

            recipe.prep.split('\n').filter(s => s.trim()).forEach(step => {
                html += `<div class="step">${escapeHtml(step.trim())}</div>`;
            });

            html += `
                </div>

                <div class="recipe-section">
                    <h2>Bereiding</h2>
            `;

            recipe.cooking.split('\n').filter(s => s.trim()).forEach(step => {
                let processedStep = escapeHtml(step.trim());
                // Markeer ingrediënten
                recipe.ingredients.forEach(ingredient => {
                    const ingredientName = ingredient.split(/[\d\s]+/)[0].trim();
                    if (ingredientName) {
                        const regex = new RegExp(`\\b${ingredientName}\\b`, 'gi');
                        processedStep = processedStep.replace(regex, `<strong>$&</strong>`);
                    }
                });
                html += `<div class="step">${processedStep}</div>`;
            });

            html += `
                    <button class="btn-secondary back-btn" onclick="backToInput()">
                        Nieuw recept
                    </button>
                </div>
            `;

            document.getElementById('recipeView').innerHTML = html;
            document.getElementById('recipeView').classList.add('active');
        }

        // Scale ingredient
        function scaleIngredient(ingredient, scale) {
            const match = ingredient.match(/^(\d+(?:\.?\d+)?)\s*(.*)$/);
            if (match) {
                const amount = (parseFloat(match[1]) * scale).toFixed(1);
                const unit = match[2];
                return `${amount}${unit ? ' ' + unit : ''}`;
            }
            return ingredient;
        }

        // Change servings
        function changeServings(delta) {
            currentServings = Math.max(1, currentServings + delta);
            renderRecipe();
        }

        // Toggle favorite
        function toggleFavorite() {
            if (!currentRecipe) return;
            const favorites = getFavorites();
            const index = favorites.findIndex(f => f.name === currentRecipe.name);

            if (index > -1) {
                favorites.splice(index, 1);
                currentRecipe.isFavorite = false;
            } else {
                favorites.unshift({ name: currentRecipe.name, recipe: currentRecipe });
                currentRecipe.isFavorite = true;
            }

            saveFavorites(favorites);
            renderRecipe();
        }

        // Switch tabs
        function switchTab(index) {
            document.querySelectorAll('.tab').forEach((t, i) => {
                t.classList.toggle('active', i === index);
            });

            if (index === 0) {
                document.getElementById('recipeView').classList.add('active');
                document.getElementById('historyTab').classList.remove('active');
                document.getElementById('favoritesTab').classList.remove('active');
            } else if (index === 1) {
                document.getElementById('recipeView').classList.remove('active');
                document.getElementById('historyTab').classList.add('active');
                document.getElementById('favoritesTab').classList.remove('active');
                updateHistoryList();
            } else if (index === 2) {
                document.getElementById('recipeView').classList.remove('active');
                document.getElementById('historyTab').classList.remove('active');
                document.getElementById('favoritesTab').classList.add('active');
                updateFavoritesList();
            }
        }

        // Update history
        function updateHistoryList() {
            const history = getHistory();
            const list = document.getElementById('historyList');
            const empty = document.getElementById('historyEmpty');

            if (history.length === 0) {
                list.innerHTML = '';
                empty.style.display = 'block';
                return;
            }

            empty.style.display = 'none';
            list.innerHTML = history.map((item, i) => `
                <div class="history-item">
                    <a onclick="loadFromHistory(${i})">${escapeHtml(item.name)}</a>
                    <button class="btn-small btn-danger" onclick="deleteFromHistory(${i})">✕</button>
                </div>
            `).join('');
        }

        function loadFromHistory(index) {
            const history = getHistory();
            if (history[index]) {
                displayRecipe(history[index].recipe);
            }
        }

        function deleteFromHistory(index) {
            const history = getHistory();
            history.splice(index, 1);
            saveHistory(history);
            updateHistoryList();
        }

        // Update favorites
        function updateFavoritesList() {
            const favorites = getFavorites();
            const list = document.getElementById('favoritesList');
            const empty = document.getElementById('favoritesEmpty');

            if (favorites.length === 0) {
                list.innerHTML = '';
                empty.style.display = 'block';
                return;
            }

            empty.style.display = 'none';
            list.innerHTML = favorites.map((item, i) => `
                <div class="favorite-item">
                    <a onclick="loadFromFavorites(${i})">${escapeHtml(item.name)}</a>
                    <button class="btn-small btn-danger" onclick="deleteFromFavorites(${i})">✕</button>
                </div>
            `).join('');
        }

        function loadFromFavorites(index) {
            const favorites = getFavorites();
            if (favorites[index]) {
                displayRecipe(favorites[index].recipe);
            }
        }

        function deleteFromFavorites(index) {
            const favorites = getFavorites();
            favorites.splice(index, 1);
            saveFavorites(favorites);
            updateFavoritesList();
        }

        // Back to input
        function backToInput() {
            currentRecipe = null;
            currentServings = 4;
            document.getElementById('inputSection').style.display = 'flex';
            document.getElementById('tabsSection').classList.remove('active');
            document.getElementById('recipeView').classList.remove('active');
            document.getElementById('recipeName').value = '';
            document.getElementById('recipeServings').value = '4';
            document.getElementById('recipeTime').value = '30';
            document.getElementById('recipeIngredients').value = '';
            document.getElementById('recipePrep').value = '';
            document.getElementById('recipeCooking').value = '';
        }

        // Demo recipe
        function loadDemo() {
            document.getElementById('recipeName').value = 'Spaghetti Carbonara';
            document.getElementById('recipeServings').value = '4';
            document.getElementById('recipeTime').value = '20';
            document.getElementById('recipeIngredients').value = '400g spaghetti\n200g pancetta\n4 eieren\n100g Pecorino Romano kaas\nzout en peper';
            document.getElementById('recipePrep').value = `Stap 1: Snijd de pancetta in dunne strookjes.
Stap 2: Rasp de Pecorino Romano kaas fijn.
Stap 3: Klop de eieren in een kom en meng met geraspte kaas.`;
            document.getElementById('recipeCooking').value = `Stap 1: Kook water aan de kook en voeg zout toe.
Stap 2: Kook de spaghetti tot al dente, ongeveer 8-10 minuten.
Stap 3: Bak ondertussen de pancetta in een pan tot deze krokant is.
Stap 4: Giet de gekookte spaghetti in de pan met pancetta (bewaar wat kookvocht).
Stap 5: Haul van het vuur en voeg het ei-kaas mengsel toe, schep snel door.
Stap 6: Breng op smaak met zout en peper.
Stap 7: Serveer direct in borden.`;
        }

        // Utility
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
